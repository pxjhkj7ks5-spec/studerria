name: OSINT Social Graph

on:
  push:
    branches: [main]
    paths: ['services/osint-graph/**', 'app.js', 'config/nav.config.js', 'middleware/nav.js', 'middleware/osintGateway.js', 'migrations/075_osint_access_permission.js', 'views/admin.ejs', 'test/osint-gateway.test.js', 'docs/osint-social-graph/**', 'docker/local/docker-compose.yml', 'docker/local/docker-compose.osint.yml', 'docker/local/osint-db-init.sh', 'scripts/server-update.sh', 'scripts/*osint*', '.github/workflows/osint-graph.yml']
  pull_request:
    paths: ['services/osint-graph/**', 'app.js', 'config/nav.config.js', 'middleware/nav.js', 'middleware/osintGateway.js', 'migrations/075_osint_access_permission.js', 'views/admin.ejs', 'test/osint-gateway.test.js', 'docs/osint-social-graph/**', 'docker/local/docker-compose.yml', 'docker/local/docker-compose.osint.yml', 'docker/local/osint-db-init.sh', 'scripts/server-update.sh', 'scripts/*osint*', '.github/workflows/osint-graph.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: osint_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: studerria_osint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U osint_test -d studerria_osint_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/osint-graph
    env:
      OSINT_TEST_DATABASE_URL: postgres://osint_test:integration-only-password@127.0.0.1:5432/studerria_osint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/osint-graph/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Check service image
        working-directory: .
        run: docker build -t studerria-osint-ci services/osint-graph
      - name: Check Compose configuration
        working-directory: .
        run: docker compose --env-file docker/local/.env.example -f docker/local/docker-compose.yml -f docker/local/docker-compose.osint.yml config --quiet
